name: Final copy audit
on:
  push:
    branches: [fix/final-copy-audit-20260821]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-copy-audit-20260821
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/final-copy-audit.mjs
      - run: npm run build
      - name: Commit fixes and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/certificates final-copy-audit-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: apply final certificate copy audit"
          git push origin HEAD:fix/final-copy-audit-20260821
