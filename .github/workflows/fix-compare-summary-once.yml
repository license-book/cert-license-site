name: Fix compare summary once

on:
  push:
    branches:
      - fix/compare-summary-particle-safe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compare-summary-particle-safe
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fix-compare-summary-once.mjs
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CertificateCompare.tsx
          git commit -m "fix: make compare summary particle-safe"
          git push origin HEAD:fix/compare-summary-particle-safe
